<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wladi AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, #171735, transparent 35%),
                radial-gradient(circle at 90% 100%, #111d3d, transparent 35%),
                #08080d;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 65px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;

            display: flex;
            align-items: center;

            padding: 0 25px;

            background: rgba(10, 10, 16, 0.8);
            backdrop-filter: blur(20px);

            border-bottom: 1px solid #282832;
        }

        .logo {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            font-size: 20px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            margin-right: 12px;
        }

        .titel {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            margin-left: 12px;
            color: #6ee7b7;
            font-size: 13px;
        }

        .punkt {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* CHAT */

        #chat {
            position: absolute;

            top: 65px;
            bottom: 115px;
            left: 0;
            right: 0;

            overflow-y: auto;

            padding: 30px 20px;
        }

        .willkommen {
            text-align: center;
            margin-top: 70px;
            margin-bottom: 35px;
        }

        .willkommen h1 {
            font-size: 42px;
            margin-bottom: 8px;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .willkommen p {
            color: #777;
        }

        .nachricht {
            max-width: 760px;

            margin: 14px auto;

            padding: 15px 18px;

            border-radius: 20px;

            line-height: 1.6;

            font-size: 16px;

            word-wrap: break-word;
        }

        .du {
            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            margin-right: 0;

            border-bottom-right-radius: 6px;
        }

        .ki {
            background: #181820;

            border: 1px solid #2c2c38;

            margin-left: 0;

            border-bottom-left-radius: 6px;
        }

        /* BILD-VORSCHAU */

        #bildVorschau {
            display: none;

            position: absolute;

            bottom: 105px;
            left: 50%;

            transform: translateX(-50%);

            width: min(700px, 90%);

            background: #15151d;

            border: 1px solid #30303b;

            border-radius: 15px;

            padding: 10px;
        }

        #bildVorschau img {
            max-width: 100%;
            max-height: 150px;

            border-radius: 10px;
        }

        .bildEntfernen {
            display: block;

            margin-top: 6px;

            background: #292933;

            color: white;

            border: none;

            padding: 5px 10px;

            border-radius: 8px;

            cursor: pointer;
        }

        /* EINGABE */

        #eingabeBereich {
            position: fixed;

            bottom: 18px;
            left: 50%;

            transform: translateX(-50%);

            width: min(850px, calc(100% - 30px));

            min-height: 64px;

            display: flex;
            align-items: center;

            padding: 8px 10px;

            gap: 8px;

            background: rgba(25, 25, 34, 0.95);

            backdrop-filter: blur(20px);

            border: 1px solid #383844;

            border-radius: 30px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.45);

            z-index: 20;
        }

        /* PLUS BUTTON */

        #bildButton {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border-radius: 50%;

            border: none;

            background: #292933;

            color: white;

            font-size: 25px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bildButton:hover {
            background: #383844;
        }

        #eingabe {
            flex: 1;

            height: 45px;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            font-size: 16px;
        }

        #eingabe::placeholder {
            color: #85858f;
        }

        /* SENDEN */

        #sendenButton {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        #sendenButton:hover {
            transform: scale(1.05);
        }

        #sendenButton:disabled {
            opacity: 0.5;
        }

        /* KOPIEREN */

        .kopieren {
            display: block;

            margin-top: 10px;

            background: transparent;

            border: 1px solid #3a3a46;

            color: #aaa;

            padding: 6px 10px;

            border-radius: 8px;

            cursor: pointer;
        }

        .kopieren:hover {
            background: #292933;
            color: white;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .status {
                display: none;
            }

            #eingabeBereich {
                width: calc(100% - 18px);
                bottom: 9px;
            }

            .nachricht {
                max-width: 90%;
            }
        }
    </style>
</head>


<body>

<header>

    <div class="logo">W</div>

    <div class="titel">
        Wladi AI
    </div>

    <div class="status">
        <span class="punkt"></span>
        Online
    </div>

</header>


<div id="chat">

    <div class="willkommen">

        <h1>Wladi AI</h1>

        <p>Dein persönlicher KI-Assistent</p>

    </div>

    <div class="nachricht ki">

        Hallo! 👋 Ich bin Wladi AI.
        <br>
        Was möchtest du wissen?

    </div>

</div>


<!-- BILD VORSCHAU -->

<div id="bildVorschau">

    <img id="vorschauBild">

    <button
        class="bildEntfernen"
        onclick="bildEntfernen()"
    >
        Bild entfernen
    </button>

</div>


<!-- EINGABE -->

<div id="eingabeBereich">

    <button
        id="bildButton"
        onclick="document.getElementById('bildDatei').click()"
    >
        +
    </button>

    <input
        type="file"
        id="bildDatei"
        accept="image/*"
        hidden
        onchange="bildAuswaehlen(event)"
    >

    <input
        id="eingabe"
        type="text"
        placeholder="Nachricht an Wladi AI..."
        autocomplete="off"
    >

    <button
        id="sendenButton"
        onclick="senden()"
    >
        ↑
    </button>

</div>


<script>

let ausgewaehltesBild = null;

let istAmAntworten = false;


/* BILD AUSWÄHLEN */

function bildAuswaehlen(event) {

    let datei =
        event.target.files[0];

    if (!datei) {
        return;
    }

    ausgewaehltesBild = datei;

    let reader =
        new FileReader();

    reader.onload =
        function(e) {

            document.getElementById(
                "vorschauBild"
            ).src = e.target.result;

            document.getElementById(
                "bildVorschau"
            ).style.display = "block";

        };

    reader.readAsDataURL(datei);
}


/* BILD ENTFERNEN */

function bildEntfernen() {

    ausgewaehltesBild = null;

    document.getElementById(
        "bildDatei"
    ).value = "";

    document.getElementById(
        "bildVorschau"
    ).style.display = "none";
}


/* NACHRICHT SENDEN */

async function senden() {

    if (istAmAntworten) {
        return;
    }

    let eingabe =
        document.getElementById("eingabe");

    let chat =
        document.getElementById("chat");

    let button =
        document.getElementById("sendenButton");

    let frage =
        eingabe.value.trim();


    if (
        frage === "" &&
        !ausgewaehltesBild
    ) {
        return;
    }


    istAmAntworten = true;

    button.disabled = true;


    /* Nutzer Nachricht */

    let nachricht =
        document.createElement("div");

    nachricht.className =
        "nachricht du";


    if (frage !== "") {

        nachricht.textContent =
            frage;

    }


    if (ausgewaehltesBild) {

        let bild =
            document.createElement("img");

        bild.src =
            URL.createObjectURL(
                ausgewaehltesBild
            );

        bild.style.maxWidth =
            "250px";

        bild.style.borderRadius =
            "12px";

        bild.style.display =
            "block";

        bild.style.marginTop =
            "10px";

        nachricht.appendChild(
            bild
        );

    }


    chat.appendChild(
        nachricht
    );


    eingabe.value = "";

    bildEntfernen();


    chat.scrollTop =
        chat.scrollHeight;


    /* Ladeanzeige */

    let laden =
        document.createElement("div");

    laden.className =
        "nachricht ki";

    laden.textContent =
        "Wladi AI schreibt...";

    chat.appendChild(
        laden
    );


    try {

        let antwort =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        frage: frage
                    })
                }
            );


        let daten =
            await antwort.json();


        laden.remove();


        let kiNachricht =
            document.createElement(
                "div"
            );

        kiNachricht.className =
            "nachricht ki";


        let text =
            daten.antwort;


        let textElement =
            document.createElement(
                "span"
            );


        kiNachricht.appendChild(
            textElement
        );


        /* Kopieren */

        let kopieren =
            document.createElement(
                "button"
            );

        kopieren.className =
            "kopieren";

        kopieren.textContent =
            "📋 Kopieren";


        kopieren.onclick =
            async function() {

                await navigator.clipboard
                    .writeText(text);

                kopieren.textContent =
                    "✓ Kopiert!";

                setTimeout(
                    function() {

                        kopieren.textContent =
                            "📋 Kopieren";

                    },
                    1500
                );

            };


        kiNachricht.appendChild(
            kopieren
        );


        chat.appendChild(
            kiNachricht
        );


        /* SCHREIBEFFEKT */

        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            textElement.textContent +=
                text[i];

            chat.scrollTop =
                chat.scrollHeight;

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        3
                    )
            );

        }

    }

    catch (fehler) {

        laden.remove();

        let fehlerNachricht =
            document.createElement(
                "div"
            );

        fehlerNachricht.className =
            "nachricht ki";

        fehlerNachricht.textContent =
            "Wladi AI konnte gerade keine Verbindung herstellen.";

        chat.appendChild(
            fehlerNachricht
        );

    }


    istAmAntworten = false;

    button.disabled = false;

    eingabe.focus();
}


/* ENTER */

document
    .getElementById("eingabe")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                senden();
            }

        }
    );

</script>

</body>

</html>
